[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
poise-core = { path = "crates/poise-core" }
poise-protocol = { path = "crates/poise-protocol" }
poise-platform = { path = "crates/poise-platform" }
poise-hardware = { path = "crates/poise-hardware" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
