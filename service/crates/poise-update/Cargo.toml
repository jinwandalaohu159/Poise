[package]
name = "poise-update"
description = "Poise 更新：查询 GitHub 上的最新发布（托盘代理定期检查），以及更新助手 poise-updater（下载、安装、启动新版本，显示进度）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "poise-updater"
path = "src/main.rs"

[dependencies]
poise-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
