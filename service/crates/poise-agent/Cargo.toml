[package]
name = "poise-agent"
description = "Poise 托盘代理：常驻用户会话，托盘图标与菜单、感知前台窗口并上报服务、按需启动界面"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "poise-agent"
path = "src/main.rs"

[dependencies]
poise-core.workspace = true
poise-protocol.workspace = true
poise-platform.workspace = true
poise-update.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# 实现 COM 接口（音频会话通知）用的宏要求直接依赖它，版本与 windows 一致。
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
